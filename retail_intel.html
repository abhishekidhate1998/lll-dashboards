:root{--bg:#0d0f14;--panel:#15181f;--panel2:#1b1f28;--line:#2a2f3a;--ink:#eef1f6;--mut:#8a93a6;--gold:#e8b84b;--gold2:#f5d27a;--green:#3fbf7f;--red:#e8645a;--blue:#5aa9e8;--purple:#b48be8;--chip:#222732;--shadow:0 8px 30px rgba(0,0,0,.45)}

.kpi.alert .v{color:var(--red)}.kpi.good .v{color:var(--green)}

.card .top h3{font-family:'Oswald';font-weight:700;text-transform:uppercase;letter-spacing:.6px;font-size:18px;margin:0}
.card .top .meta{color:var(--mut);font-size:12.5px;margin-top:3px}

.pill.red{color:var(--red);border-color:var(--red)}.pill.green{color:var(--green);border-color:var(--green)}

.t-red{background:rgba(232,100,90,.15);color:var(--red)}.t-amb{background:rgba(232,184,75,.15);color:var(--gold)}.t-grn{background:rgba(63,191,127,.15);color:var(--green)}
.t-blu{background:rgba(90,169,232,.15);color:var(--blue)}.t-pur{background:rgba(180,139,232,.15);color:var(--purple)}

.up{color:var(--red);font-weight:700}.down{color:var(--green);font-weight:700}
.acc{border-bottom:1px solid var(--line)}
.acc .hd{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer}
.acc .hd:hover{background:rgba(255,255,255,.02)}
.acc .nm{font-weight:600;font-size:14px}.acc .wh{color:var(--mut);font-size:12px;margin-top:2px}
.acc .rt{margin-left:auto;text-align:right;white-space:nowrap}
.acc .val{font-family:'Oswald';font-weight:700;color:var(--gold2);font-size:16px}
.chev{color:var(--mut);transition:.15s;margin-left:8px}.acc.open .chev{transform:rotate(90deg)}
.body{display:none;padding:4px 18px 18px;background:var(--panel2)}.acc.open .body{display:block}
.steps{display:grid;gap:10px;margin-top:6px}
.step{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--panel)}
.step.done{border-color:var(--green);background:rgba(63,191,127,.06)}
.step.cur{border-color:var(--gold);box-shadow:0 0 0 1px rgba(232,184,75,.25)}
.step .sh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;font-family:'Barlow Semi Condensed';letter-spacing:.3px}
.step .who{color:var(--mut);font-weight:600;font-size:12px}
.step .desc{color:var(--mut);font-size:12px;margin:3px 0 8px}
.step .logged{font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-top:6px}
.step .logged b{color:var(--gold2)}
.fld{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.fld input[type=date],.fld select,.fld textarea{background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--ink);font-family:'Barlow';font-size:13px;padding:7px 8px;outline:none}
.fld textarea{flex:1;min-width:200px;min-height:34px;resize:vertical}
.btn{font-family:'Barlow Semi Condensed';font-weight:700;font-size:12px;letter-spacing:.4px;text-transform:uppercase;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.g{background:rgba(63,191,127,.12);border-color:var(--green);color:var(--green)}
.btn.r{background:rgba(232,100,90,.12);border-color:var(--red);color:var(--red)}
.btn.p{background:rgba(180,139,232,.12);border-color:var(--purple);color:var(--purple)}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.flt .btn.on{border-color:var(--gold);color:var(--gold);background:var(--panel)}
.spark{display:flex;align-items:flex-end;gap:3px;height:64px;padding:8px 18px 14px}.spark>i{flex:1;background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:3px 3px 0 0;min-height:3px}
.done-x{color:var(--green);font-weight:700}
.empty{padding:26px 18px;color:var(--mut);text-align:center;font-size:13px}

.last-updated-banner{background:rgba(63,174,107,.08);border-bottom:1px solid rgba(63,174,107,.2);padding:7px 22px;font-size:12px;color:#3fae6b;display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:200}

<header><div class="hbar">
<div class="logo"><b>Little Leaf</b> Labs<span class="az">SALES</span></div>
<div class="tabs" id="tabs"></div>
</div></header>
<div class="wrap" id="app"></div>
<script>
const D={"market":{"meta":{"period":"Jan 1 - May 31, 2026","days":151,"totalBrands":0,"totalDispensaries":0,"marketUnits":0,"marketValue":0},"brands":[],"dispensaries":[],"categories":[],"daily":[]},"lapsed":[],"shelf":{"doors":0,"oos":0,"on_shelf":0,"total":0}};

const LS='lll_sales_actions_v1';
function load(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return {}}}
function save(s){localStorage.setItem(LS,JSON.stringify(s))}
let STATE=load();
function acc(name){if(!STATE[name])STATE[name]={stage:1,visitor:'',attempts:[],coo:false,closed:false};return STATE[name]}
const today=()=>new Date().toISOString().slice(0,10);
const $=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const money=n=>'$'+Math.round(n||0).toLocaleString();
const esc=s=>(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

const TABS=[['action','Action List'],['coo','COO Follow-Up'],['stock','Stock-Outs'],['lapsed','Lapsed Accts'],['price','Price Moves'],['sku','Top SKUs'],['dist','New Doors']];
const tabsEl=document.getElementById('tabs'),app=document.getElementById('app');
let CUR='action';
function cooCount(){return Object.values(STATE).filter(a=>a.coo&&!a.closed).length}
function buildTabs(){tabsEl.innerHTML='';TABS.forEach(([id,lbl],i)=>{const b=$('<button class="tab" data-v="'+id+'">'+lbl+(id=='coo'&&cooCount() ' <span class="b">'+cooCount()+'</span>':'')+'</button>');if(id==CUR)b.classList.add('on');b.onclick=()=>{CUR=id;render()};tabsEl.appendChild(b)})}

// ===== escalation workflow definition =====
function stepPlan(a){
 const visitor=a.visitor||'Rocco / Matt';
 const other=a.visitor==='Rocco' 'Matt':(a.visitor==='Matt' 'Rocco':'whoever did not go');
 return [
  {k:'In-person visit',who:visitor,method:'visit',desc:'Rocco OR Matt visits the account in person.'},
  {k:'Follow-up call / email',who:'Matt',method:'call',desc:'Matt follows up by phone or email -- 1 week after the visit.'},
  {k:'Second in-person visit',who:other,method:'visit',desc:'Whoever did NOT do the first visit goes in person -- 1 week later.'}
 ];
}
function logStep(name,idx){
 const a=acc(name),p=stepPlan(a);
 const date=document.getElementById('dt_'+idx).value||today();
 const note=document.getElementById('nt_'+idx).value.trim();
 const outcome=document.getElementById('oc_'+idx).value;
 let who=p[idx].who;
 if(idx===0){who=document.getElementById('vis_'+idx).value;a.visitor=who}
 a.attempts[idx]={step:p[idx].k,method:p[idx].method,who:who,date:date,note:note,outcome:outcome};
 if(outcome==='won'){a.closed=true;a.coo=false}
 else{a.stage=Math.min(4,idx+2);if(idx>=2)a.coo=true}
 save(STATE);render();
}
function sendCOO(name){const a=acc(name);a.coo=true;a.stage=4;save(STATE);CUR='coo';render()}
function reopen(name){const a=acc(name);a.closed=false;a.coo=false;a.stage=Math.min(3,(a.attempts.length||0)+1);save(STATE);render()}
function closeCOO(name,won){const a=acc(name);a.closed=true;a.coo=false;a.wonByCOO=won;save(STATE);render()}

function tierTag(t){return t==='Reorder' '<span class="tag t-red">REORDER $</span>':t==='New Door' '<span class="tag t-blu">NEW DOOR</span>':'<span class="tag t-pur">LAPSED</span>'}

function accCard(it){
 const name=it.name,a=acc(name),plan=stepPlan(a);
 if(a.closed) return ''; // resolved drop off action list
 const open=a._open 'open':'';
 const done=a.attempts.filter(Boolean).length;
 let h='<div class="acc '+open+'" data-nm="'+esc(name)+'">';
 h+='<div class="hd" onclick="toggle(this)"><div><div class="nm">'+esc(name)+' '+tierTag(it.tier)+'</div><div class="wh">'+esc(it.why)+'</div></div>'
   +'<div class="rt"><div class="val">'+(it.metric money(it.metric):'--')+'</div><div class="wh">'+done+'/3 logged</div></div><span class="chev"> </span></div>';
 h+='<div class="body"><div class="steps">';
 plan.forEach((s,idx)=>{
   const at=a.attempts[idx];
   const cls=at 'done':(done===idx 'cur':'');
   h+='<div class="step '+cls+'"><div class="sh">'+(at '  ':'')+ (idx+1)+'. '+s.k+' <span class="who">-- '+esc(s.who)+(s.method==='visit' ' . in person':' . call/email')+'</span></div><div class="desc">'+s.desc+'</div>';
   if(at){
     h+='<div class="logged"><b>'+esc(at.who)+'</b> . '+esc(at.method)+' . '+esc(at.date)+' . <b>'+esc(at.outcome)+'</b>'+(at.note '<br>'+esc(at.note):'')+'</div>';
   } else if(done===idx){
     h+='<div class="fld">';
     if(idx===0)h+='<select id="vis_0"><option>Rocco</option><option>Matt</option></select>';
     h+='<input type="date" id="dt_'+idx+'" value="'+today()+'"><select id="oc_'+idx+'"><option value="no answer">no answer</option><option value="left msg">left msg</option><option value="spoke">spoke, no order</option><option value="won">WON -- ordered</option></select>'
      +'<textarea id="nt_'+idx+'" placeholder="notes..."></textarea>'
      +'<button class="btn g" onclick="logStep(\''+esc(name).replace(/'/g,"\\'")+'\','+idx+')">Log step '+(idx+1)+'</button></div>';
   } else {
     h+='<div class="desc" style="opacity:.5">Locked until previous step is logged.</div>';
   }
   h+='</div>';
 });
 h+='</div>';
 if(done>=3 && !a.coo) h+='<div style="margin-top:10px"><button class="btn p" onclick="sendCOO(\''+esc(name).replace(/'/g,"\\'")+'\')">All 3 attempts done -> Send to Chris (COO Follow-Up)</button></div>';
 h+='</div></div>';
 return h;
}
function toggle(el){const a=acc(el.closest('.acc').dataset.nm);a._open=!a._open;el.closest('.acc').classList.toggle('open')}

let FILTER='all';
function viewAction(){
 let h='<h2 class="sec">Weekly Account Action List</h2><p class="sub">Priority order: <b>Reorder Value</b> (selling through, no recent order)   <b>New Doors</b> (whitespace)   <b>Lapsed</b>. Workflow: <b>Rocco or Matt visit</b> -> <b>Matt</b> calls/emails after 1 wk -> the <b>other</b> visits after another wk -> escalate to <b>Chris (COO Follow-Up)</b>. Log each attempt with date + notes; it persists in this browser.</p>';
 const list=D.action_list;
 const counts={Reorder:0,'New Door':0,Lapsed:0};list.forEach(x=>counts[x.tier]++);
 const openReorderVal=list.filter(x=>x.tier==='Reorder').reduce((s,x)=>s+x.metric,0);
 h+='<div class="kpis">'
  +'<div class="kpi alert"><div class="v">'+list.filter(x=>!acc(x.name).closed).length+'</div><div class="l">Open targets</div><div class="d">this week</div></div>'
  +'<div class="kpi"><div class="v">'+money(openReorderVal)+'</div><div class="l">Reorder $ / wk in play</div><div class="d">retail sell-through at risk</div></div>'
  +'<div class="kpi"><div class="v">'+counts['Reorder']+' . '+counts['New Door']+' . '+counts['Lapsed']+'</div><div class="l">Reorder . New . Lapsed</div></div>'
  +'<div class="kpi"><div class="v">'+Object.values(STATE).filter(a=>a.attempts&&a.attempts.filter(Boolean).length).length+'</div><div class="l">Accounts actioned</div></div>'
  +'<div class="kpi"><div class="v">'+cooCount()+'</div><div class="l">In COO Follow-Up</div></div></div>';
 h+='<div class="flt">'+['all','Reorder','New Door','Lapsed'].map(f=>'<button class="btn'+(FILTER===f ' on':'')+'" onclick="setF(\''+f+'\')">'+(f==='all' 'All':f)+'</button>').join('')+'</div>';
 h+='<div class="card"><div class="top"><div><h3>Targets</h3><div class="meta">Click a row to open the call/visit workflow</div></div><span class="pill red">Action</span></div><div id="acclist">';
 const rows=list.filter(x=>FILTER==='all'||x.tier===FILTER);
 const body=rows.map(accCard).filter(Boolean).join('');
 h+=(body||'<div class="empty">No open targets in this filter -- nice work.</div>')+'</div></div>';
 return h;
}
function setF(f){FILTER=f;render()}

function viewCOO(){
 const items=Object.entries(STATE).filter(([n,a])=>a.coo&&!a.closed);
 let h='<h2 class="sec">COO Follow-Up List</h2><p class="sub">Accounts where all three Rocco/Matt attempts are logged and the door still hasn't reordered. Full contact history below -- <b>Chris</b> works these to close. Copy the list for your records or mark closed.</p>';
 h+='<div style="margin-bottom:12px"><button class="btn" onclick="copyCOO()">Copy list</button></div>';
 if(!items.length){h+='<div class="card"><div class="empty">Nothing escalated yet. Accounts arrive here after 3 logged attempts.</div></div>';return h}
 items.forEach(([name,a])=>{
   const it=D.action_list.find(x=>x.name===name)||{why:'',metric:0,tier:''};
   h+='<div class="card"><div class="top"><div><h3>'+esc(name)+'</h3><div class="meta">'+tierTag(it.tier)+' '+esc(it.why)+'</div></div><span class="pill">'+money(it.metric)+'</span></div>';
   h+='<table><thead><tr><th>#</th><th>Step</th><th>Who</th><th>Method</th><th>Date</th><th>Outcome</th><th>Notes</th></tr></thead><tbody>';
   a.attempts.filter(Boolean).forEach((at,i)=>{h+='<tr><td>'+(i+1)+'</td><td>'+esc(at.step)+'</td><td>'+esc(at.who)+'</td><td>'+esc(at.method)+'</td><td>'+esc(at.date)+'</td><td>'+esc(at.outcome)+'</td><td>'+esc(at.note)+'</td></tr>'});
   h+='</tbody></table><div style="padding:12px 18px;display:flex;gap:8px"><button class="btn g" onclick="closeCOO(\''+esc(name).replace(/\'/g,"\\'")+'\',true)">Closed -- WON</button><button class="btn r" onclick="closeCOO(\''+esc(name).replace(/\'/g,"\\'")+'\',false)">Closed -- lost</button><button class="btn" onclick="reopen(\''+esc(name).replace(/\'/g,"\\'")+'\')">Reopen</button></div></div>';
 });
 return h;
}
function copyCOO(){
 const items=Object.entries(STATE).filter(([n,a])=>a.coo&&!a.closed);
 let t='LITTLE LEAF -- COO FOLLOW-UP LIST ('+today()+')\n\n';
 items.forEach(([name,a])=>{const it=D.action_list.find(x=>x.name===name)||{};t+='  '+name+' ['+(it.tier||'')+'] '+(it.metric money(it.metric):'')+'\n  '+(it.why||'')+'\n';a.attempts.filter(Boolean).forEach((at,i)=>{t+='   '+(i+1)+'. '+at.step+' -- '+at.who+' ('+at.method+') '+at.date+' . '+at.outcome+(at.note ' . '+at.note:'')+'\n'})});
 navigator.clipboard.writeText(t).then(()=>alert('COO list copied to clipboard'));
}

function viewStock(){
 let h='<h2 class="sec">Stock-Outs &amp; Replenishment</h2><p class="sub">'+D.stock_alerts.total+' shelf alerts fired this week. <b>'+D.shelf.oos_pct+'%</b> of our '+D.shelf.listings+' live retail listings are out-of-stock -- each is a lost sale. Cross-check the worst doors against the Action List.</p>';
 h+='<div class="grid"><div class="card"><div class="top"><div><h3>Most Stock Alerts (week)</h3></div><span class="pill red">'+D.stock_alerts.total+'</span></div><table><thead><tr><th>Dispensary</th><th class="n">Alerts</th></tr></thead><tbody>'+D.stock_alerts.by_disp.map(r=>'<tr><td>'+esc(r.disp)+'</td><td class="n">'+r.alerts+'</td></tr>').join('')+'</tbody></table></div>';
 h+='<div class="card"><div class="top"><div><h3>Most OOS Listings (live)</h3></div></div><table><thead><tr><th>Dispensary</th><th class="n">OOS SKUs</th></tr></thead><tbody>'+D.shelf.oos_by_disp.map(r=>'<tr><td>'+esc(r.disp)+'</td><td class="n">'+r.oos+'</td></tr>').join('')+'</tbody></table></div></div>';
 h+='<div class="card"><div class="top"><div><h3>Brand Fully Sold Out At Door</h3><div class="meta">Zero of our brand on shelf -- urgent reorder</div></div><span class="pill red">'+D.sold_out.length+'</span></div><table><thead><tr><th>Dispensary</th><th>Brand</th><th class="n">Times this week</th></tr></thead><tbody>'+D.sold_out.map(r=>'<tr><td>'+esc(r.disp)+'</td><td>'+esc(r.brand)+'</td><td class="n">'+r.times+'</td></tr>').join('')+'</tbody></table></div>';
 return h;
}
function viewLapsed(){
 const L=D.lapsed_enriched;
 let h='<h2 class="sec">Lapsed Accounts -- Value At Risk</h2><p class="sub">'+L.n+' accounts haven't ordered in 45+ days. <b>Avg order value</b> = the size of each order we're missing; <b>missed-to-date</b> estimates cumulative lost revenue at the account's own historical reorder cadence.</p>';
 h+='<div class="kpis"><div class="kpi alert"><div class="v">'+money(L.total_missed)+'</div><div class="l">Est. revenue missed to date</div></div><div class="kpi"><div class="v">'+L.n+'</div><div class="l">Lapsed accounts</div></div><div class="kpi"><div class="v">'+money(L.total_aov)+'</div><div class="l">Combined avg-order value</div></div></div>';
 h+='<div class="card"><div class="top"><div><h3>Lapsed Accounts by Missed Value</h3></div><span class="pill red">'+L.n+'</span></div><table><thead><tr><th>Buyer</th><th class="n">Avg order value</th><th class="n">Reorder cycle</th><th class="n">Days lapsed</th><th class="n">Est. missed $</th><th class="n">Lifetime $</th></tr></thead><tbody>'+L.list.map(r=>'<tr><td>'+esc(r.buyer)+'</td><td class="n">'+money(r.aov)+'</td><td class="n">'+r.cadence+'d</td><td class="n"><span class="tag '+(r.days>=120 't-red':r.days>=75 't-amb':'t-grn')+'">'+r.days+'d</span></td><td class="n">'+money(r.missed)+'</td><td class="n">'+money(r.ltv)+'</td></tr>').join('')+'</tbody></table></div>';
 return h;
}
function viewPrice(){
 let h='<h2 class="sec">Retail Price Moves</h2><p class="sub">Every menu price change on our SKUs this week. <span class="up">  up</span> = retailer taking margin (room to hold our wholesale price); <span class="down">  down</span> = discounting that can erode brand price integrity.</p>';
 h+='<div class="card"><div class="top"><div><h3>'+D.price_moves.length+' Price Changes</h3></div></div><table><thead><tr><th>Dir</th><th>Dispensary</th><th>Product</th></tr></thead><tbody>'+D.price_moves.map(r=>'<tr><td>'+(r.dir=='up' '<span class="up">  up</span>':'<span class="down">  down</span>')+'</td><td>'+esc(r.disp)+'</td><td>'+esc(r.desc)+'</td></tr>').join('')+'</tbody></table></div>';
 return h;
}
function viewSku(){
 let h='<h2 class="sec">Top Selling SKUs</h2><p class="sub">Weekly = actual retail sell-through (Lit, units). Monthly = wholesale shipped (Apex, $, last full month). Feed both into the production forecast as true-demand signals.</p><div class="grid">';
 h+='<div class="card"><div class="top"><div><h3>This Week -- Retail Sell-Through</h3><div class="meta">Lit . '+D.week.label+' . units</div></div><span class="pill green">'+D.week.units.toLocaleString()+' u</span></div><table><thead><tr><th>#</th><th>SKU</th><th class="n">Units</th><th class="n">Retail $</th></tr></thead><tbody>'+D.top_skus.map((r,i)=>'<tr><td class="n">'+(i+1)+'</td><td>'+esc(r.sku)+'</td><td class="n">'+r.units.toLocaleString()+'</td><td class="n">'+money(r.value)+'</td></tr>').join('')+'</tbody></table></div>';
 h+='<div class="card"><div class="top"><div><h3>This Month -- Wholesale</h3><div class="meta">'+D.top_skus_month.label+'</div></div></div><table><thead><tr><th>#</th><th>SKU</th><th class="n">Wholesale $</th></tr></thead><tbody>'+D.top_skus_month.list.map((r,i)=>'<tr><td class="n">'+(i+1)+'</td><td>'+esc(r.sku)+'</td><td class="n">'+money(r.val)+'</td></tr>').join('')+'</tbody></table></div></div>';
 return h;
}
function viewDist(){
 let h='<h2 class="sec">New-Door Whitespace</h2><p class="sub">We sell through in <b>'+D.penetration.selling+'</b> of <b>'+D.penetration.total+'</b> NJ dispensaries ('+D.penetration.pct+'%). <b>'+D.whitespace_full.length+'</b> doors carry no Little Leaf product -- the prospecting list (top 25 already seeded into the Action List).</p>';
 h+='<div class="card"><div class="top"><div><h3>Doors With No Little Leaf ('+D.whitespace_full.length+')</h3></div><span class="pill">Prospects</span></div><table><thead><tr><th>Dispensary</th><th>City</th><th>Zip</th></tr></thead><tbody>'+D.whitespace_full.map(r=>'<tr><td>'+esc(r.disp)+'</td><td>'+esc(r.city)+'</td><td>'+esc(r.zip)+'</td></tr>').join('')+'</tbody></table></div>';
 return h;
}
const VIEWS={action:viewAction,coo:viewCOO,stock:viewStock,lapsed:viewLapsed,price:viewPrice,sku:viewSku,dist:viewDist};
function render(){buildTabs();app.innerHTML='';app.appendChild($('<div class="view on">'+VIEWS[CUR]()+'</div>'));app.appendChild($('<div class="foot">Sales Command Center . Sources: Lit menu monitoring (sell-through, shelf, price) + Apex CRM (buyer &amp; product performance). Action notes saved locally in this browser. Week of '+D.week.label+'. Refresh weekly via the scheduled export pull.</div>'))}
window.toggle=toggle;window.logStep=logStep;window.sendCOO=sendCOO;window.reopen=reopen;window.closeCOO=closeCOO;window.setF=setF;window.copyCOO=copyCOO;
render();
