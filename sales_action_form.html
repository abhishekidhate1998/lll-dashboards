<!DOCTYPE html><html><head><!-- LLL_VIEWER_START --><script>(function(){var SU='https://script.google.com/macros/s/AKfycbwUgf728sst5z8MUxqRCmt_0IIAIHLuQx0cPwIkjGis543cnP7pR-9Ezl3wql67oDo8Dw/exec';var SK='lll_vs';function getToken(){try{var d=JSON.parse(sessionStorage.getItem(SK)||'{}');return d.token||null;}catch(e){return null;}}function showLogin(){var o=document.createElement('div');o.id='_lll_ov';o.style='position:fixed;inset:0;background:#0e1414;z-index:99999;display:flex;align-items:center;justify-content:center;font-family:sans-serif';o.innerHTML='<div style="background:#16201f;border:1px solid #283533;border-radius:18px;padding:40px 36px;width:340px;text-align:center"><div style="font-size:36px;margin-bottom:14px">&#127807;</div><h2 style="color:#e8efe9;font-size:20px;font-weight:700;margin-bottom:6px">Little Leaf Labs</h2><p style="color:#92a39c;font-size:13px;margin-bottom:24px">Enter your credentials to view this dashboard</p><input id="_lll_u" type="text" placeholder="Username" autocomplete="username" style="width:100%;background:#1c2826;border:1px solid #283533;border-radius:9px;padding:10px 14px;color:#e8efe9;font-size:14px;outline:none;margin-bottom:10px;box-sizing:border-box"><input id="_lll_p" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;background:#1c2826;border:1px solid #283533;border-radius:9px;padding:10px 14px;color:#e8efe9;font-size:14px;outline:none;margin-bottom:12px;box-sizing:border-box"><div id="_lll_e" style="color:#ff7378;font-size:12px;min-height:20px;margin-bottom:10px"></div><button id="_lll_b" style="width:100%;background:#3fae6b;color:#0e1414;padding:11px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;border:none">Sign In</button></div>';document.body.appendChild(o);setTimeout(function(){var i=document.getElementById('_lll_u');if(i)i.focus();},100);function go(){var u=document.getElementById('_lll_u').value.trim();var p=document.getElementById('_lll_p').value;var e=document.getElementById('_lll_e');if(!u||!p){e.textContent='Please enter username and password.';return;}document.getElementById('_lll_b').disabled=true;e.textContent='Verifying...';fetch(SU,{method:'POST',body:JSON.stringify({action:'viewerLogin',username:u,password:p})}).then(r=>r.json()).then(d=>{if(d.success){sessionStorage.setItem(SK,JSON.stringify({token:d.token,username:d.username}));document.getElementById('_lll_ov').remove();}else{e.textContent=d.error||'Incorrect credentials';document.getElementById('_lll_p').value='';document.getElementById('_lll_b').disabled=false;}}).catch(function(){e.textContent='Connection error. Check internet.';document.getElementById('_lll_b').disabled=false;});}document.getElementById('_lll_b').addEventListener('click',go);document.getElementById('_lll_p').addEventListener('keydown',function(e2){if(e2.key==='Enter')go();});document.getElementById('_lll_u').addEventListener('keydown',function(e2){if(e2.key==='Enter')go();});}var tok=getToken();if(!tok){if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',showLogin);}else{showLogin();}}else{fetch(SU,{method:'POST',body:JSON.stringify({action:'verifyToken',token:tok,role:'viewer'})}).then(r=>r.json()).then(d=>{if(!d.success){sessionStorage.removeItem(SK);if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',showLogin);}else{showLogin();}}}).catch(function(){});}})();</script><!-- LLL_VIEWER_END --><meta charset='UTF-8'></head><body><!-- LLL_BOT_START --><style>#_lb{position:fixed;bottom:24px;right:24px;background:linear-gradient(135deg,#3fae6b,#2c7d4c);color:#0e1414;border:none;border-radius:28px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;z-index:8000;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(63,174,107,.4);transition:transform .15s}#_lb:hover{transform:scale(1.05)}#_lp{position:fixed;bottom:80px;right:24px;width:360px;max-height:520px;background:#16201f;border:1px solid #283533;border-radius:16px;display:none;flex-direction:column;z-index:8000;box-shadow:0 8px 40px rgba(0,0,0,.5)}#_lp.open{display:flex}._lh{padding:14px 16px;border-bottom:1px solid #283533;display:flex;align-items:center;justify-content:space-between}._lh h4{font-size:14px;font-weight:600;color:#e8efe9}._lh p{font-size:11px;color:#92a39c}._lhc{background:none;border:none;color:#92a39c;cursor:pointer;font-size:18px;line-height:1}._lm{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}._lmsg{max-width:88%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.5;color:#e8efe9}._lmsg.u{background:rgba(63,174,107,.15);border:1px solid rgba(63,174,107,.25);align-self:flex-end;border-radius:12px 12px 4px 12px}._lmsg.a{background:#1c2826;border:1px solid #283533;align-self:flex-start;border-radius:12px 12px 12px 4px}._lmsg.t{color:#92a39c;font-style:italic;align-self:flex-start}._lr{font-size:11px;color:#92a39c;padding:0 14px 8px;text-align:right}._li{padding:12px 14px;border-top:1px solid #283533;display:flex;gap:8px}._li input{flex:1;background:#1c2826;border:1px solid #283533;border-radius:9px;padding:9px 12px;color:#e8efe9;font-size:13px;outline:none}._li input:focus{border-color:#3fae6b}._ls{background:#3fae6b;color:#0e1414;border:none;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer}._ls:disabled{opacity:.4;cursor:not-allowed}</style><button id="_lb" onclick="_lt()">&#127807; Ask Claude</button><div id="_lp"><div class="_lh"><div><h4>Little Leaf Assistant</h4><p>Powered by Claude</p></div><button class="_lhc" onclick="_lt()">&#215;</button></div><div class="_lm" id="_lm"><div class="_lmsg a">Hi! Ask me anything about this dashboard &mdash; revenue, customers, inventory, trends, and more.</div></div><div class="_lr" id="_lr"></div><div class="_li"><input type="text" id="_lci" placeholder="Ask a question..." onkeydown="if(event.key==='Enter')_ls2()"><button class="_ls" id="_lsb" onclick="_ls2()">Send</button></div></div><script>var _LSU='https://script.google.com/macros/s/AKfycbwUgf728sst5z8MUxqRCmt_0IIAIHLuQx0cPwIkjGis543cnP7pR-9Ezl3wql67oDo8Dw/exec';function _lt(){var p=document.getElementById('_lp');p.classList.toggle('open');if(p.classList.contains('open'))document.getElementById('_lci').focus();}function _lctx(){var c=document.title+'\n';try{if(typeof FOUND!=='undefined')c+='KPIs: '+JSON.stringify(FOUND)+'\n';if(typeof SEED_CUST!=='undefined')c+='Top customers: '+JSON.stringify(SEED_CUST.slice(0,15))+'\n';if(typeof SEED_SKU!=='undefined')c+='Top SKUs: '+JSON.stringify(SEED_SKU.slice(0,15))+'\n';if(typeof SEED_SALES!=='undefined')c+='Sales: '+JSON.stringify(SEED_SALES)+'\n';if(typeof D!=='undefined')c+='Data: '+JSON.stringify(D).slice(0,3000)+'\n';if(typeof MKT!=='undefined')c+='Market: '+JSON.stringify(MKT).slice(0,3000)+'\n';}catch(e){}return c;}async function _ls2(){var inp=document.getElementById('_lci');var q=inp.value.trim();if(!q)return;var sess=sessionStorage.getItem('lll_vs');if(!sess){alert('Please log in first.');return;}var tok=JSON.parse(sess).token;var msgs=document.getElementById('_lm');var um=document.createElement('div');um.className='_lmsg u';um.textContent=q;msgs.appendChild(um);var tm=document.createElement('div');tm.className='_lmsg t';tm.textContent='Thinking...';msgs.appendChild(tm);msgs.scrollTop=msgs.scrollHeight;inp.value='';document.getElementById('_lsb').disabled=true;try{var r=await fetch(_LSU,{method:'POST',body:JSON.stringify({action:'chatbot',token:tok,question:q,context:_lctx()})});var d=await r.json();tm.className='_lmsg a';if(d.success){tm.textContent=d.answer;if(d.remaining!==undefined)document.getElementById('_lr').textContent=d.remaining+' questions remaining this hour';}else{tm.textContent='Error: '+(d.error||'Try again');}}catch(e){tm.className='_lmsg a';tm.textContent='Connection error. Try again.';}document.getElementById('_lsb').disabled=false;msgs.scrollTop=msgs.scrollHeight;}</script><!-- LLL_BOT_END --></body></html>
