<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Little Leaf Labs</title>
<style>
:root{--bg:#0e1414;--panel:#16201f;--p2:#1c2826;--ink:#e8efe9;--mu:#92a39c;--ln:#283533;--gr:#3fae6b;--gd:#2c7d4c;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

/* LOGIN */
#lw{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center}
.lbox{background:var(--panel);border:1px solid var(--ln);border-radius:18px;padding:40px 36px;width:340px;text-align:center}
.lbox h1{font-size:20px;font-weight:700;margin-bottom:4px}
.lbox p{color:var(--mu);font-size:13px;margin-bottom:24px}
.lbox input{width:100%;background:var(--p2);border:1px solid var(--ln);border-radius:9px;padding:10px 14px;color:var(--ink);font-size:14px;outline:none;margin-bottom:10px;display:block}
.lbox input:focus{border-color:var(--gr)}
#lerr{color:#ff7378;font-size:12px;min-height:18px;margin-bottom:8px;text-align:left}
#lbtn{width:100%;background:var(--gr);color:#0e1414;padding:12px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;border:none}
#lbtn:disabled{opacity:.5;cursor:not-allowed}

/* APP */
#app{display:none;flex-direction:column;height:100%}
#app.on{display:flex}

/* TOPBAR */
.tb{background:var(--panel);border-bottom:1px solid var(--ln);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0;z-index:100}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700}
.bdot{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--gr),var(--gd));display:flex;align-items:center;justify-content:center;font-size:15px}
.who{font-size:12px;color:var(--mu)}
.who b{color:var(--gr)}
.lout{background:var(--p2);border:1px solid var(--ln);border-radius:7px;padding:5px 12px;font-size:12px;color:var(--ink);cursor:pointer}
.lout:hover{border-color:var(--gr);color:var(--gr)}

/* BODY */
.ab{display:flex;flex:1;overflow:hidden;min-height:0}

/* SIDEBAR */
.sb{width:210px;background:var(--panel);border-right:1px solid var(--ln);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sbh{padding:14px 16px 6px;font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;color:var(--mu);font-size:13px;font-weight:500;border-left:3px solid transparent;border:none;background:none;width:100%;text-align:left;transition:all .15s}
.nav-item:hover{background:var(--p2);color:var(--ink)}
.nav-item.on{background:rgba(63,174,107,.1);color:var(--gr);border-left:3px solid var(--gr)}
.ni{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nl{flex:1;line-height:1.3}

/* CONTENT AREA */
.ca{flex:1;position:relative;overflow:hidden;background:var(--bg)}

/* IFRAMES */
.dash-frame{
  position:absolute;inset:0;width:100%;height:100%;
  border:none;display:none;background:var(--bg);
}
.dash-frame.on{display:block}

/* LOADING OVERLAY */
.loading{
  position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:12px;
  background:var(--bg);z-index:10;pointer-events:none;
  transition:opacity .3s;
}
.loading.hide{opacity:0}
.spinner{width:36px;height:36px;border:3px solid var(--ln);border-top-color:var(--gr);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:13px;color:var(--mu)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="lw">
  <div class="lbox">
    <div style="font-size:42px;margin-bottom:14px">🌿</div>
    <h1>Little Leaf Labs</h1>
    <p>Sign in to access the dashboards</p>
    <input type="text"     id="lu" placeholder="Username" autocomplete="username">
    <input type="password" id="lp" placeholder="Password" autocomplete="current-password">
    <div id="lerr"></div>
    <button id="lbtn" onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="tb">
    <div class="brand"><div class="bdot">🌿</div>Little Leaf Labs</div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="who">Signed in as <b id="wn">-</b></span>
      <button class="lout" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div class="ab">
    <div class="sb">
      <div class="sbh">Dashboards</div>
      <button class="nav-item" id="nav-master" onclick="showDash('master')"><span class="ni">📊</span><span class="nl">Master Dashboard</span></button>
<button class="nav-item" id="nav-weekly" onclick="showDash('weekly')"><span class="ni">📋</span><span class="nl">Weekly Exec</span></button>
<button class="nav-item" id="nav-retail" onclick="showDash('retail')"><span class="ni">🛒</span><span class="nl">Retail Intel</span></button>
<button class="nav-item" id="nav-refresh" onclick="showDash('refresh')"><span class="ni">🔄</span><span class="nl">Weekly Refresh</span></button>
<button class="nav-item" id="nav-sales" onclick="showDash('sales')"><span class="ni">📈</span><span class="nl">Sales Dashboard</span></button>
<button class="nav-item" id="nav-action" onclick="showDash('action')"><span class="ni">✅</span><span class="nl">Action Form</span></button>
<button class="nav-item" id="nav-command" onclick="showDash('command')"><span class="ni">⚡</span><span class="nl">Command Center</span></button>

    </div>
    <div class="ca" id="ca">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading dashboard...</p>
      </div>
      <iframe id="frame-master" class="dash-frame" src="" data-src="https://abhishekidhate1998.github.io/lll-dashboards/master_dashboard.html" allowfullscreen></iframe>
<iframe id="frame-weekly" class="dash-frame" src="" data-src="https://abhishekidhate1998.github.io/lll-dashboards/weekly_exec.html" allowfullscreen></iframe>
<iframe id="frame-retail" class="dash-frame" src="" data-src="https://abhishekidhate1998.github.io/lll-dashboards/retail_intel.html" allowfullscreen></iframe>
<iframe id="frame-refresh" class="dash-frame" src="" data-src="https://abhishekidhate1998.github.io/lll-dashboards/weekly_refresh.html" allowfullscreen></iframe>
<iframe id="frame-sales" class="dash-frame" src="" data-src="https://abhishekidhate1998.github.io/lll-dashboards/sales_dashboard.html" allowfullscreen></iframe>
<iframe id="frame-action" class="dash-frame" src="" data-src="https://abhishekidhate1998.github.io/lll-dashboards/sales_action_form.html" allowfullscreen></iframe>
<iframe id="frame-command" class="dash-frame" src="" data-src="https://abhishekidhate1998.github.io/lll-dashboards/lit_sales_command_center.html" allowfullscreen></iframe>

    </div>
  </div>
</div>

<script>
var SU  = "https://script.google.com/macros/s/AKfycbwUgf728sst5z8MUxqRCmt_0IIAIHLuQx0cPwIkjGis543cnP7pR-9Ezl3wql67oDo8Dw/exec";
var SK  = "lll_vs";
var tok = null;
var loaded = {};

function api(p, cb) {
  if (tok) p.token = tok;
  var enc = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
  fetch(SU + "?p=" + encodeURIComponent(enc), {method:"GET"})
    .then(function(r) { return r.json(); }).then(cb)
    .catch(function() { cb({success:false, error:"Connection error"}); });
}

/* ── LOGIN ── */
document.getElementById("lp").addEventListener("keydown", function(e) { if(e.key==="Enter") doLogin(); });
document.getElementById("lu").addEventListener("keydown", function(e) { if(e.key==="Enter") doLogin(); });

function doLogin() {
  var u   = document.getElementById("lu").value.trim();
  var p   = document.getElementById("lp").value;
  var err = document.getElementById("lerr");
  err.textContent = "";
  if (!u || !p) { err.textContent = "Please enter username and password."; return; }
  var btn = document.getElementById("lbtn");
  btn.disabled = true; btn.textContent = "Signing in...";
  api({action:"viewerLogin", username:u, password:p}, function(d) {
    if (d.success) {
      tok = d.token;
      sessionStorage.setItem(SK, JSON.stringify({token:d.token, username:d.username}));
      document.getElementById("lw").style.display = "none";
      document.getElementById("app").classList.add("on");
      document.getElementById("wn").textContent = d.username;
      showDash("master");
    } else {
      err.textContent = d.error || "Incorrect credentials.";
      document.getElementById("lp").value = "";
      btn.disabled = false; btn.textContent = "Sign In";
    }
  });
}

function doLogout() {
  sessionStorage.removeItem(SK); tok = null; loaded = {};
  document.getElementById("app").classList.remove("on");
  document.getElementById("lw").style.display = "flex";
  document.getElementById("lu").value = "";
  document.getElementById("lp").value = "";
  document.getElementById("lbtn").disabled = false;
  document.getElementById("lbtn").textContent = "Sign In";
  // Clear all iframe srcs
  document.querySelectorAll(".dash-frame").forEach(function(f) {
    f.src = ""; f.classList.remove("on");
  });
  document.querySelectorAll(".nav-item").forEach(function(n) { n.classList.remove("on"); });
}

/* ── SHOW DASHBOARD ── */
function showDash(id) {
  document.querySelectorAll(".dash-frame").forEach(function(f) { f.classList.remove("on"); });
  document.querySelectorAll(".nav-item").forEach(function(n) { n.classList.remove("on"); });

  var frame = document.getElementById("frame-" + id);
  var nav   = document.getElementById("nav-"   + id);
  if (nav) nav.classList.add("on");

  var loading = document.getElementById("loading");

  if (!frame) return;

  // If not yet loaded, set src now with token in hash
  if (!loaded[id]) {
    loading.classList.remove("hide");
    var src = frame.getAttribute("data-src");
    frame.src = src + "#token=" + encodeURIComponent(tok || "");
    loaded[id] = true;

    frame.onload = function() {
      loading.classList.add("hide");
      // After brief delay, hide loading completely
      setTimeout(function() { loading.style.display = "none"; }, 400);
      // Send token via postMessage for the viewer login to pick up
      try {
        frame.contentWindow.postMessage({
          type: "LLL_AUTH", token: tok, username: document.getElementById("wn").textContent
        }, "*");
      } catch(e) {}
    };
  } else {
    loading.style.display = "none";
  }

  frame.classList.add("on");
}

/* ── RESTORE SESSION ── */
(function() {
  var s = sessionStorage.getItem(SK);
  if (!s) return;
  try {
    var d = JSON.parse(s); if (!d.token) return;
    var enc = btoa(unescape(encodeURIComponent(JSON.stringify({action:"verifyToken",token:d.token,role:"viewer"}))));
    fetch(SU + "?p=" + encodeURIComponent(enc), {method:"GET"})
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.success) {
          tok = d.token;
          document.getElementById("lw").style.display = "none";
          document.getElementById("app").classList.add("on");
          document.getElementById("wn").textContent = d.username || "viewer";
          showDash("master");
        } else {
          sessionStorage.removeItem(SK);
        }
      }).catch(function() {});
  } catch(e) {}
})();
</script>

</body>
</html>
